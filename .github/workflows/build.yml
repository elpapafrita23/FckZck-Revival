name: Build .deb

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Theos
        uses: Randomblock1/theos-action@v1

      - name: Package
        run: make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: FckZck-deb
          path: packages/*.deb
